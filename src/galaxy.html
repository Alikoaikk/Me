<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Koaik — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Orbitron carries the name itself (see NAME_FONT in galaxy.js);
       the other two remain the UI faces. -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Hero overrides for the galaxy scene; must follow style.css. -->
  <link rel="stylesheet" href="css/galaxy.css" />
  <!-- The site's own mouse pointer, shared by every page. CSS only. -->
  <link rel="stylesheet" href="css/cursor.css" />
</head>
<body>

  <!-- No navbar and no scroll indicator by design: the galaxy owns
       the screen uncontested. A replacement nav is coming later. -->

  <!-- HERO — the galaxy owns the screen. The canvas is fixed so it
       stays put while the page scrolls over it. -->
  <section id="hero">
    <div class="hero-bg">
      <canvas id="heroCanvas"></canvas>
      <div class="noise-overlay"></div>
    </div>
    <!-- The name. Revealed by galaxy.js as the stars arrive:
         --name-ali runs 0..1 over the back half of the burst. The
         text itself has no fill and no stroke — the stars flying in
         from the galaxy are the only thing that draws it. -->
    <div class="galaxy-name" aria-label="Ali Koaik">
      <span class="gname-full">Ali Koaik</span>
      <!-- Above the name: the greeting. -->
      <p class="gname-hello">Hello, I'm</p>
      <!-- Below it, one block in normal flow, hung from the name's
           anchor (see .gname-below in galaxy.css). Type and hairlines
           only — no pills, no icons, no boxes: a short rule, what Ali
           is (small capitals), what he works on (one light line),
           where he is and that he is available, then a row of plain
           text links (the way to his work, and where to find him),
           and a quiet line from the film last. It all resolves AFTER the stars finish writing the
           name (--name-koaik) and scrolls up with it (--name-scroll).
           profile.js fills it from portfolioData; the quote is
           galaxy.js's (aria-live off: a line that changes every few
           seconds would interrupt a screen reader endlessly). -->
      <div class="gname-below" id="gnameBelow">
        <span class="gname-rule" aria-hidden="true"></span>
        <p class="gname-role" id="gnameRole"></p>
        <p class="gname-focus" id="gnameFocus"></p>
        <p class="gname-meta" id="gnameMeta"></p>
        <nav class="gname-actions" aria-label="Links">
          <a class="gname-go" href="#build" id="gnameWork">View my work<span class="gname-arrow" aria-hidden="true">&darr;</span></a>
          <span class="gname-links" id="gnameLinks"></span>
        </nav>
        <p class="gname-quote" id="gnameQuote" aria-live="off">
          <span class="gname-quote-text"></span>
        </p>
      </div>
    </div>
    <!-- The cue at the foot of the name screen: there is more below. -->
    <a class="gname-cue" href="#profile" id="gnameCue"><span>Who I am</span><span class="gname-cue-chevron" aria-hidden="true"></span></a>
  </section>

  <!-- The hero IS the name screen: one screen, then the profile. There
       is no approach and no burst any more (the #intro / #burst scroll
       spacers are gone). Scrolling on, the name's stars let go and run
       as a ribbon down the page, between the sections, and gather into
       a mini galaxy above the launch link (galaxy.js, "THE FLOW"). The
       stars never leave the sky: the canvas stays BEHIND the profile's
       sheet, and the sheet is cut open along their way (THE RIVER,
       below) so the sky shows through. -->

  <!-- PROFILE — below the name the page reads like a normal site:
       a top bar, then four sections one after another. It exists once
       the stars have written the name (.is-written); scrolling on
       moves the name up and brings this in. profile.js fills it from
       portfolioData.

         NAV        a floating glass bar: the four sections, then
                    Posts and Activities, which are pages of their
                    own. It appears once the reader is
                    into the profile (:root.nav-on) and goes when they
                    scroll back up to the name. Inside #profile on
                    purpose: it then inherits the section's gates
                    (not written yet / launched) and its --leave fade.
         #about     who Ali is, beside his portrait in a floating
                    circle with the numbers in orbit around it.
         #stack     languages → tools & IDEs → technologies.
         #education the academic path: two cards, the story of each
                    on hover (focus, or tap).
         #build     what he builds — the orbit mark. Pressing it plays the
                    take-off (the mark opens up, all this
                    fades on --leave, the name glides back to the
                    centre and its letters let go — galaxy.js) and
                    then opens system.html, where the warp and the
                    projects are.

       The sections are divs, not <section>: style.css pads sections
       at ID level. -->
  <div class="profile" id="profile">
    <nav class="site-nav" id="siteNav" aria-label="Sections">
      <div class="site-nav-links" id="navLinks">
        <span class="site-nav-blob" aria-hidden="true"></span>
        <a href="#about" data-sec="about">About</a>
        <a href="#education" data-sec="education">Career</a>
        <a href="#stack" data-sec="stack">Stack</a>
        <a href="#build" data-sec="build">Projects</a>
        <!-- Pages of their own (empty for now), not sections of this one. -->
        <span class="site-nav-sep" aria-hidden="true"></span>
        <a href="posts.html">Posts</a>
        <a href="activities.html">Activities</a>
      </div>
    </nav>

    <!-- THE SHEET: everything from "Becoming" to the end is one
         container with its own opaque background; the sky is fixed,
         so the sheet slides up over it as the page scrolls.
         THE RIVER: the sheet's background (.sheet::before) is cut open
         along the way the stars take — a channel down the margins and
         across between the sections, ending in a round window where
         the mini galaxy turns — so the sky, and the stars in it, show
         through. galaxy.js measures the page and writes the cut
         (--sheet-cut, a clip-path) and the same outline into this SVG,
         which lies UNDER the background: only the inner half of each
         stroke shows, inside the opening — a hairline of light on the
         edge and a soft shadow falling in. Static; it scrolls with the
         page like any other content. -->
    <div class="sheet">
      <svg class="sheet-edge" id="sheetEdge" aria-hidden="true" focusable="false">
        <path class="sheet-edge-shade sheet-edge-shade--far" />
        <path class="sheet-edge-shade sheet-edge-shade--near" />
        <path class="sheet-edge-rim" />
      </svg>

    <!-- ABOUT, then CAREER: the layout of aliitawi.me's two sections
         (the user's reference) with this site's content and gold. A
         strip (mark, word, rule, a line), a small numbered label, a
         very large title; then the copy and a 2x2 grid of numbers
         beside a portrait frame; then the career as a timeline. -->
    <div class="pf-sec ab" id="about" role="region" aria-labelledby="aboutTitle">
      <p class="ab-strip pf-rise"><span class="ab-mark" aria-hidden="true"></span><span class="ab-word">Becoming</span><span class="ab-strip-rule" aria-hidden="true"></span><span class="ab-strip-line" id="aboutStatus"></span></p>
      <p class="ab-label pf-rise">01 &mdash; About</p>
      <h2 class="ab-title pf-rise" id="aboutTitle">Who I Am</h2>
      <div class="ab-split">
        <div class="ab-left">
          <div class="ab-copy pf-rise" id="profileBio"></div>
          <div class="ab-stats pf-rise" id="aboutStats"></div>
          <p class="pf-links pf-rise" id="profileLinks"></p>
        </div>
        <div class="ab-frame pf-rise">
          <img id="pfPhoto" alt="" hidden>
          <span class="ab-initials" id="pfInitials" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <div class="pf-sec tl-sec" id="education" role="region" aria-labelledby="eduTitle">
      <p class="ab-label pf-rise">02 &mdash; Career</p>
      <h2 class="ab-title pf-rise" id="eduTitle">The Path So Far</h2>
      <ol class="tl" id="profileEdu"></ol>
    </div>

    <div class="pf-sec" id="stack" role="region" aria-labelledby="stackTitle">
      <header class="pf-head">
        <p class="pf-tag pf-rise">// stack</p>
        <h2 class="pf-title pf-rise" id="stackTitle">Tech stack</h2>
      </header>
      <ol class="pf-stack" id="profileStack"></ol>
    </div>

    <div class="pf-sec pf-build" id="build" role="region" aria-labelledby="buildTitle">
      <p class="pf-tag pf-rise">// projects</p>
      <h2 class="pf-title pf-rise" id="buildTitle">What I build</h2>
      <p class="profile-launch-lead pf-rise" id="profileLead"></p>
      <div class="profile-launch pf-rise">
        <!-- THE WAY ON. The mini galaxy, and under it the words. The
             box (#miniGalaxy) is EMPTY: it only reserves the place —
             galaxy.js measures it, cuts a round window in the sheet
             there and gathers the name's stars behind it as the same
             spiral the site used to open on, small and slowly turning.
             The link itself is still: nothing of it animates. A real
             link to the system's own page; galaxy.js takes the plain
             click to fade the page, then follows it. -->
        <a class="orbit-btn" id="launchBtn" href="system.html">
          <span class="launch-mark" id="miniGalaxy" aria-hidden="true"></span>
          <span class="orbit-label">Press here to start the trip<span class="gname-arrow" aria-hidden="true">&rarr;</span></span>
        </a>
      </div>
    </div>

    </div><!-- /.sheet -->
  </div>

  <script src="js/galaxy/galaxy.js"></script>
  <script src="js/data.js"></script>
  <script src="js/profile.js"></script>
  <!-- The system (three.js, system.js, emblems.js, hud.js, warp.js)
       is NOT on this page: it has its own, system.html, which the orbit
       button opens. This page is the galaxy, the name and the profile
       only. -->
  <script>
    /* Mirrors the galaxy's scroll drift onto the CSS core bloom so the
       two pan together. Page-specific, so it lives here. */
    (function () {
      'use strict';

      // Keep the CSS bloom aligned with the canvas pan. Matches
      // SCROLL_DRIFT's 0..1 progress in galaxy.js.
      const root = document.documentElement;
      let ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const h = window.innerHeight || 1;
          const p = Math.min(1, Math.max(0, window.scrollY / h));
          root.style.setProperty('--drift', p.toFixed(4));
          ticking = false;
        });
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>
</body>
</html>
