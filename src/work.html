<!DOCTYPE html>
<!-- Work: the projects of the Koaik system (system.html) as a PLAIN
     LIST — same projects, same text, same links, no 3D and no motion.
     Reached from the "3D | List" switch in the system's HUD, and it
     carries the same switch back. A plain page like posts.html /
     activities.html (css/galaxy.css "PLAIN PAGES": the static .nav-on,
     body.page, the gradient night); its own rules are in css/work.css.
     js/work.js fills the list from js/data.js — no canvas, no WebGL,
     no modules. Not projects.html: that one belongs to index.html. -->

  <link rel="stylesheet" href="css/style.css" />
