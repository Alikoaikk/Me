<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Koaik — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SCROLL PROGRESS -->
  <div id="scrollProgress"></div>

  <!-- NAVBAR -->
  <nav id="navbar">
    <a href="#hero" class="nav-logo">AK</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="#hero">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#education">Education</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <div class="hero-bg">
      <canvas id="heroCanvas"></canvas>
      <div class="noise-overlay"></div>
    </div>
    <div class="hero-content">
      <p class="hero-greeting">Hello, I'm</p>
      <h1 class="hero-name" id="heroName"></h1>
      <div class="hero-typewriter">
        <span id="typewriterText"></span><span class="cursor">|</span>
      </div>
      <div class="hero-stats" id="heroStats"></div>
      <div class="hero-ctas" id="heroCTAs"></div>
    </div>
    <a href="#about" class="scroll-indicator" aria-label="Scroll down">
      <span class="scroll-indicator-label">scroll</span>
      <span class="scroll-dot"></span>
    </a>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <div class="section-header reveal">
      <span class="section-tag">// about</span>
      <h2 class="section-title">Who I Am</h2>
    </div>
    <div class="about-grid">
      <div class="about-bio" id="aboutBio"></div>
      <div class="about-stats" id="aboutStats"></div>
    </div>
  </section>

  <!-- SKILLS -->
  <section id="skills">
    <div class="section-header reveal">
      <span class="section-tag">// skills</span>
      <h2 class="section-title">Tech Stack</h2>
    </div>
    <div id="skillsContainer"></div>
  </section>

  <!-- PROJECTS -->
  <section id="projects">
    <div class="section-header reveal">
      <span class="section-tag">// projects</span>
      <h2 class="section-title">What I've Built</h2>
    </div>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>

  <!-- EDUCATION -->
  <section id="education">
    <div class="section-header reveal">
      <span class="section-tag">// education</span>
      <h2 class="section-title">Academic Path</h2>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <div class="contact-inner" id="contactSection"></div>
  </section>

  <footer>
    <p id="footerText"></p>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
  <script src="fluid.js"></script>
</body>
</html>
